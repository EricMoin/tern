# Publish workflow — tag-triggered (vX.Y.Z) or manual dispatch.
#
# Runs the release gates first; publishing happens only when every gate
# passes:
#   Gate 1  npm pack --dry-run on @tern/core, @tern/react, @tern/solid —
#           asserts each tarball ships only src/**/*.ts (no *_test.ts).
#   Gate 2  native build of the tern-node napi addon + load-check.mjs.
#   Gate 3  napi create-npm-dirs — every target in napi.targets maps to a
#           tern-node-<platform> package (the optionalDependencies wiring
#           from the multi-platform strategy).
#
# The per-platform native release (publish tern-node-<platform> packages
# via `napi pre-publish -t npm`, then the tern-node root) is the documented
# next step in CONTRIBUTING.md and needs the platform packages to exist on
# the registry first.

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/bindings/tern-node/package-lock.json

      # napi build compiles via cargo, so the pinned Rust toolchain is
      # required; rustflags is cleared to match a local build.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # Gate 1 — pack: each publishable package must ship only src/**/*.ts
      # excluding *_test.ts. Fails the release if any test file would ship.
      - name: Gate 1 — npm pack --dry-run (@tern/core, @tern/react, @tern/solid)
        run: |
          for pkg in core react solid; do
            echo "== @tern/$pkg =="
            cd packages/$pkg
            out=$(npm pack --dry-run 2>&1)
            echo "$out"
            if echo "$out" | grep -q '_test.ts'; then
              echo "FAIL: @tern/$pkg ships a *_test.ts file"
              exit 1
            fi
            cd ../..
          done

      # Gate 2 — the native addon must build and load on the current
      # platform before anything is published. npm run build now resolves
      # to the RELEASE profile (the package.json default), so this gate
      # builds exactly the artifact that would ship. npm install (not npm
      # ci): the tern-node-<platform> optional dependencies are not yet on
      # the registry, so the lockfile cannot pin them; npm install tolerates
      # their absence as optional.
      - name: Gate 2 — build tern-node addon + load-check
        working-directory: src/bindings/tern-node
        run: |
          npm install
          npm run build
          node load-check.mjs

      # Gate 3 — the napi platform-package wiring: every target in
      # napi.targets must map to a tern-node-<platform> package. create-npm-dirs
      # scaffolds npm/<platform-suffix>/ dirs; each must contain a package.json
      # named tern-node-<platform> (the optionalDependencies wiring).
      - name: Gate 3 — napi create-npm-dirs (platform wiring)
        working-directory: src/bindings/tern-node
        run: |
          npx napi create-npm-dirs
          for pkg in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc; do
            test -d "npm/$pkg" || { echo "FAIL: missing npm/$pkg"; exit 1; }
            grep -q '"name": "tern-node-'$pkg'"' "npm/$pkg/package.json" || {
              echo "FAIL: npm/$pkg is not the tern-node-$pkg package"; exit 1; }
          done
          echo "OK: all 5 platform package dirs created"

  publish:
    name: Publish @tern packages
    needs: gates
    runs-on: ubuntu-latest
    # contents: write for GitHub release assets, id-token: write for npm
    # provenance (napi-rs release convention).
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish @tern/core
        working-directory: packages/core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tern/react
        working-directory: packages/react
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tern/solid
        working-directory: packages/solid
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

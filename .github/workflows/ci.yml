name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of this workflow for the same ref (a newer push
# supersedes the run still in flight on that branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter: per-job change detection. Workflow-level `paths` cannot
  # target individual jobs, so a filter job computes which areas changed
  # and the four build jobs gate on its outputs. Needs pull-requests: read
  # because PR path detection uses the REST API; on push, changes are
  # detected against the previous commit on the same branch.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/core/**'
              - 'src/bindings/**'
              - 'examples/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            js:
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
            smoke:
              - 'src/bindings/tern-node/**'
              - 'packages/examples/**'

  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7

      # Reads the toolchain pinned in rust-toolchain.toml (Rust 1.94.0).
      # rustflags is cleared so the build matches a plain local
      # `cargo build --workspace` invocation (the action's default
      # RUSTFLAGS=-D warnings would be stricter than local).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          # Cargo caching is handled by Swatinem/rust-cache below; disabling
          # the built-in cache (default on) avoids two overlapping cache
          # entries for the same cargo registry and target dirs.
          cache: false

      # Cargo cache: restores/saves the cargo registry and the workspace
      # target dir. The whole repo is a single Cargo workspace, so the
      # default workspace detection covers every crate in this job.
      - uses: Swatinem/rust-cache@v2

      - name: Format check (fmt)
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

  bench:
    # Render-bench regression gate (M2): re-runs the Rust compositor bench
    # and gates every metric against the recorded constants (±10%) via
    # tools/bench/run.sh --check. Wired to the same rust path filter as the
    # rust job — the bench lives under src/core/tern-components.
    # The bench_timing cargo test runs as its own step first so a bench
    # binary compile/failure surfaces as that step instead of inside run.sh's
    # captured output; run.sh --check then re-runs it (cargo cache makes the
    # second invocation fast) and applies the gate. The TS bench self-skips
    # headlessly (render.bench.ts `skip()` contract — no addon / unusable
    # terminal on a bare ubuntu runner), so only the Rust segment is gated.
    name: Bench (Rust regression gate)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7

      # Same pinned toolchain + cargo cache as the rust job: rustflags is
      # cleared so the release bench build matches a plain local invocation.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          # Cargo caching is handled by Swatinem/rust-cache below; disabling
          # the built-in cache (default on) avoids two overlapping cache
          # entries for the same cargo registry and target dirs.
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Run Rust bench (bench_timing)
        run: cargo test --release -p tern-components --test bench_timing -- --ignored --nocapture

      - name: Regression gate (run.sh --check)
        run: bash tools/bench/run.sh --check

  js:
    name: JS workspace (check + test)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.js == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # The repo's package.json scripts run deno check / deno test.
      - uses: denoland/setup-deno@v2
        with:
          # Cache downloaded deno modules & packages in the GitHub cache.
          # cache-hash defaults to a hash of any deno.lock files; none exist
          # yet, so the job-scoped key is used until lockfiles are added.
          cache: true

      # npm install (not npm ci): the root workspace now includes
      # src/bindings/tern-node, whose tern-node-<platform> optional
      # dependencies are not yet on the registry, so the lockfile cannot pin
      # them and npm ci's sync check would fail (CONTRIBUTING.md, "Building
      # the native addon").
      - name: Install JS dependencies
        run: npm install

      # Emit dist/ for each published package (core first — react/solid
      # resolve @tern-tui/core types from its dist via the workspace symlink).
      # The tsc type-check step below runs against src with noEmit, so the
      # build must run first to produce the dist the dev checks resolve.
      - name: Build JS packages (tsc emit)
        run: npm run build -w @tern-tui/core && npm run build -w @tern-tui/react && npm run build -w @tern-tui/solid

      - name: Lint (deno lint)
        run: deno lint

      # Typescript is a devDependency of each workspace package, so `npx tsc`
      # resolves the locally-installed compiler after `npm install`. Each
      # package's tsconfig extends tsconfig.base.json at the repo root.
      - name: Type check (tsc)
        run: npx tsc -p packages/core && npx tsc -p packages/react && npx tsc -p packages/solid && npx tsc -p packages/examples

      - name: Type check (deno check)
        run: npm run check

      - name: Tests (deno test)
        run: npm test

  smoke:
    # PTY smoke for the @tern-tui/examples demos. The run-smoke.sh harness pipes
    # 'q' into each demo inside a pseudo-TTY via the macOS `script` utility
    # (the demos only exit 0 when their scene rendered AND the event loop quit
    # on 'q'), so this job must run on macOS. The native tern-node addon is
    # built here because the demos load it at runtime.
    name: Smoke (PTY demos, macOS)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    steps:
      - uses: actions/checkout@v7

      # napi build compiles the binding via cargo, so the pinned Rust
      # toolchain is required. rustflags is cleared to match a local build.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          # Cargo caching is handled by Swatinem/rust-cache below; disabling
          # the built-in cache (default on) avoids two overlapping cache
          # entries for the same cargo registry and target dirs.
          cache: false

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          # Hash every package-lock.json in the repo so both the root
          # `npm install` and the tern-node addon `npm install` below share one
          # npm cache keyed on all lockfiles.
          cache-dependency-path: "**/package-lock.json"

      # The demos run under deno (deno-first, constitution §3).
      - uses: denoland/setup-deno@v2
        with:
          # Cache downloaded deno modules & packages (the PTY demos import
          # the tern core modules on every run).
          cache: true

      # npm install (not npm ci): the root workspace includes
      # src/bindings/tern-node, whose tern-node-<platform> optional
      # dependencies are not yet on the registry, so the lockfile cannot pin
      # them and npm ci's sync check would fail (CONTRIBUTING.md, "Building
      # the native addon").
      - name: Install JS dependencies
        run: npm install

      # Build the tern-node napi addon in DEBUG (npm run build:debug).
      # Compile speed matters for this correctness-only smoke and the
      # runtime profile is irrelevant to PTY correctness (demos exit 0
      # iff the scene rendered AND 'q' quits).
      # npm install (not npm ci): the tern-node-<platform> optional
      # dependencies declared for the release strategy are not yet on the
      # registry, so the lockfile cannot pin them; npm install tolerates
      # their absence as optional.
      - name: Build tern-node addon
        working-directory: src/bindings/tern-node
        run: |
          npm install
          npm run build:debug

      - name: PTY smoke (script harness)
        run: bash packages/examples/run-smoke.sh

  napi-build:
    # Multi-platform native addon strategy (napi-rs distribution model):
    # build tern-node for every target in `napi.targets` (tern-node
    # package.json) — the full release.yml build matrix. Since M4.3 every
    # feasible row also gets a real runtime verification: a native load-check
    # where the runner arch matches the target, plus a runtime smoke
    # (runtime-smoke.mjs, the M4.3 headless renderer gate) executed in a
    # runtime matching the binary — native node, a node:alpine container for
    # the musl rows, or (for FreeBSD) the dedicated freebsd-runtime job.
    # Rows without a matching hosted runtime stay build-only. Each row
    # uploads its <platform>-<arch>.node binary; release.yml wires the
    # per-platform binaries via optionalDependencies as tern-node-<platform>
    # packages. `npm run build` resolves to the RELEASE profile — these
    # binaries are the release artifacts consumed by release.yml.
    name: napi addon — ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build
            load_check: true
            runtime: node runtime-smoke.mjs
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            # M4.3: native arm64 build on the arm64 hosted runner — replaces
            # release.yml's apt cross gcc (no glibc-floor trade-off when the
            # binary is built on the target arch). Runner arch matches the
            # target, so load-check + runtime smoke run natively.
            build: npm run build
            load_check: true
            runtime: node runtime-smoke.mjs
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            # musl: -x routes through cargo-zigbuild (zig on PATH, set up
            # below); the CLI auto-appends -C target-feature=-crt-static, so
            # the binary is static musl — no glibc floor. The glibc runner
            # cannot load the musl binary, so the runtime smoke runs inside a
            # node:alpine container (mirrors the napi-rs template's musl
            # container test).
            zig: true
            build: npx napi build --platform --release --target x86_64-unknown-linux-musl --cross-compile && node fix-dts.mjs
            load_check: false
            runtime: "docker run --rm -v $PWD:/check -w /check node:alpine node runtime-smoke.mjs"
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            # arm64 musl on the arm64 runner: zig cross-build, then the same
            # node:alpine container smoke — Docker pulls the arm64 image
            # automatically on this host (no --platform flag needed).
            zig: true
            build: npx napi build --platform --release --target aarch64-unknown-linux-musl --cross-compile && node fix-dts.mjs
            load_check: false
            runtime: "docker run --rm -v $PWD:/check -w /check node:alpine node runtime-smoke.mjs"
          - host: ubuntu-latest
            target: x86_64-unknown-freebsd
            # FreeBSD: no hosted FreeBSD runner, so -x + zig cross-compiles
            # from Linux (cargo-zigbuild). Build-only here — the binary's
            # runtime verification happens in the freebsd-runtime job (a
            # FreeBSD 15 VM via cross-platform-actions/action, mirroring the
            # napi-rs reference setup).
            zig: true
            build: npx napi build --platform --release --target x86_64-unknown-freebsd --cross-compile && node fix-dts.mjs
            load_check: false
            runtime: ""
          - host: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            # riscv64: napi-rs ships no generated CI job for it — the recipe
            # is "no flag + a cross gcc you install" (decision matrix). No
            # riscv64 hosted runner / official Node runtime → build-only
            # (verify on-device).
            build: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu && CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc npx napi build --platform --release --target riscv64gc-unknown-linux-gnu && node fix-dts.mjs
            load_check: false
            runtime: ""
          - host: ubuntu-latest
            target: aarch64-linux-android
            # Android/Termux: no cross flag — the CLI configures the NDK
            # toolchain from ANDROID_NDK_LATEST_HOME (preinstalled on
            # ubuntu-latest runners) and stops before Cargo if it is missing.
            # Build-only: no Android runtime on hosted runners; verify
            # on-device (e.g. Termux).
            build: npx napi build --platform --release --target aarch64-linux-android && node fix-dts.mjs
            load_check: false
            runtime: ""
          - host: macos-latest
            target: x86_64-apple-darwin
            # Direct napi invocation (arg forwarding as above); the macos
            # runner (arm64) cross-links x86_64 natively with no cross flag.
            # Build-only: macos-latest is arm64, so there is no x64 mac
            # hosted runtime to load-check on.
            build: npx napi build --platform --release --target x86_64-apple-darwin && node fix-dts.mjs
            load_check: false
            runtime: ""
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build
            load_check: true
            runtime: node runtime-smoke.mjs
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build
            load_check: true
            runtime: node runtime-smoke.mjs
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            # M4.3: native arm64 build on the windows-11-arm hosted runner.
            # rustup is not preinstalled on that image, so it is bootstrapped
            # manually below (mirroring the napi-rs template); the standard
            # toolchain action is skipped on this host. Runner arch matches
            # the target, so load-check + runtime smoke run natively.
            build: npm run build
            load_check: true
            runtime: node runtime-smoke.mjs
    steps:
      - uses: actions/checkout@v7

      # Windows 11 ARM: rustup is not preinstalled on the windows-11-arm
      # image, so it is bootstrapped manually before the toolchain step
      # (mirroring the napi-rs template's windows-11-arm steps).
      - name: Install rustup (windows-11-arm)
        if: ${{ matrix.settings.host == 'windows-11-arm' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
          .\rustup-init.exe --default-toolchain none -y
          "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          "CARGO_HOME=$env:USERPROFILE\.cargo" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Install Rust (windows-11-arm)
        if: ${{ matrix.settings.host == 'windows-11-arm' }}
        shell: pwsh
        run: |
          rustup install stable
          rustup target add ${{ matrix.settings.target }}
          cargo --version

      # napi build compiles via cargo, so the pinned Rust toolchain is
      # required; rustflags is cleared to match a local build. The target
      # triple is registered via rustup for the cross-compiled rows. Skipped
      # on windows-11-arm, which bootstraps rustup manually above.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: ${{ matrix.settings.host != 'windows-11-arm' }}
        with:
          rustflags: ""
          target: ${{ matrix.settings.target }}
          # Cargo caching is handled by Swatinem/rust-cache below; disabling
          # the built-in cache (default on) avoids two overlapping cache
          # entries for the same cargo registry and target dirs.
          cache: false

      - uses: Swatinem/rust-cache@v2

      # zig is the cross linker for the musl and FreeBSD rows (-x routes
      # through cargo-zigbuild, which the CLI auto-installs; the explicit
      # install below pins the version like the napi-rs generated CI).
      - uses: mlugg/setup-zig@v2
        if: ${{ matrix.settings.zig }}
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        if: ${{ matrix.settings.zig }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/bindings/tern-node/package-lock.json

      - name: Install addon dependencies
        working-directory: src/bindings/tern-node
        run: npm install

      - name: Build addon (${{ matrix.settings.target }})
        working-directory: src/bindings/tern-node
        run: ${{ matrix.settings.build }}

      # Native load check on rows where the runner arch matches the target.
      - name: Load check (native)
        working-directory: src/bindings/tern-node
        if: ${{ matrix.settings.load_check }}
        run: node load-check.mjs

      # M4.3 runtime smoke: runs runtime-smoke.mjs (the M4.3 headless
      # renderer gate) in a runtime matching the binary — native node on
      # runner-matching rows, node:alpine for the musl rows. Rows with an
      # empty `runtime` (freebsd — verified by the freebsd-runtime job —
      # darwin-x64, riscv64, android) skip this step.
      - name: Runtime smoke (${{ matrix.settings.target }})
        working-directory: src/bindings/tern-node
        if: ${{ matrix.settings.runtime != '' }}
        run: ${{ matrix.settings.runtime }}

      - name: Upload addon binary
        uses: actions/upload-artifact@v7
        with:
          name: tern-node-${{ matrix.settings.target }}
          path: src/bindings/tern-node/tern-node.*.node
          if-no-files-found: error

  freebsd-runtime:
    # M4.3 runtime verification for the FreeBSD binary: no hosted FreeBSD
    # runner exists, so the x86_64-unknown-freebsd artifact built by the
    # napi-build job is downloaded and executed inside a FreeBSD 15 VM via
    # cross-platform-actions/action (the napi-rs reference setup). The
    # action syncs the workspace into the VM and runs the script at the
    # workspace root; node is installed via pkg, then the M4.3 runtime smoke
    # runs against the downloaded binary.
    name: Runtime smoke — freebsd x64 (FreeBSD VM)
    runs-on: ubuntu-latest
    needs: [changes, napi-build]
    if: needs.changes.outputs.smoke == 'true'
    steps:
      - uses: actions/checkout@v7

      # Download the binary built by the napi-build freebsd row into the
      # addon dir, next to index.js and runtime-smoke.mjs.
      - name: Download freebsd addon binary
        uses: actions/download-artifact@v8
        with:
          name: tern-node-x86_64-unknown-freebsd
          path: src/bindings/tern-node

      - name: Runtime smoke (FreeBSD VM)
        uses: cross-platform-actions/action@v1.4.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          operating_system: freebsd
          version: '15.0'
          shell: bash
          run: |
            sudo pkg install -y node
            node --version
            cd src/bindings/tern-node && node runtime-smoke.mjs

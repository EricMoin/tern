name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of this workflow for the same ref (a newer push
# supersedes the run still in flight on that branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter: per-job change detection. Workflow-level `paths` cannot
  # target individual jobs, so a filter job computes which areas changed
  # and the four build jobs gate on its outputs. Needs pull-requests: read
  # because PR path detection uses the REST API; on push, changes are
  # detected against the previous commit on the same branch.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/core/**'
              - 'src/bindings/**'
              - 'examples/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            js:
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
            smoke:
              - 'src/bindings/tern-node/**'
              - 'packages/examples/**'

  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v7

      # Reads the toolchain pinned in rust-toolchain.toml (Rust 1.94.0).
      # rustflags is cleared so the build matches a plain local
      # `cargo build --workspace` invocation (the action's default
      # RUSTFLAGS=-D warnings would be stricter than local).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          # Cargo caching is handled by Swatinem/rust-cache below; disabling
          # the built-in cache (default on) avoids two overlapping cache
          # entries for the same cargo registry and target dirs.
          cache: false

      # Cargo cache: restores/saves the cargo registry and the workspace
      # target dir. The whole repo is a single Cargo workspace, so the
      # default workspace detection covers every crate in this job.
      - uses: Swatinem/rust-cache@v2

      - name: Format check (fmt)
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

  js:
    name: JS workspace (check + test)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.js == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # The repo's package.json scripts run deno check / deno test.
      - uses: denoland/setup-deno@v2
        with:
          # Cache downloaded deno modules & packages in the GitHub cache.
          # cache-hash defaults to a hash of any deno.lock files; none exist
          # yet, so the job-scoped key is used until lockfiles are added.
          cache: true

      # npm install (not npm ci): the root workspace now includes
      # src/bindings/tern-node, whose tern-node-<platform> optional
      # dependencies are not yet on the registry, so the lockfile cannot pin
      # them and npm ci's sync check would fail (CONTRIBUTING.md, "Building
      # the native addon").
      - name: Install JS dependencies
        run: npm install

      # Emit dist/ for each published package (core first — react/solid
      # resolve @tern-tui/core types from its dist via the workspace symlink).
      # The tsc type-check step below runs against src with noEmit, so the
      # build must run first to produce the dist the dev checks resolve.
      - name: Build JS packages (tsc emit)
        run: npm run build -w @tern-tui/core && npm run build -w @tern-tui/react && npm run build -w @tern-tui/solid

      - name: Lint (deno lint)
        run: deno lint

      # Typescript is a devDependency of each workspace package, so `npx tsc`
      # resolves the locally-installed compiler after `npm install`. Each
      # package's tsconfig extends tsconfig.base.json at the repo root.
      - name: Type check (tsc)
        run: npx tsc -p packages/core && npx tsc -p packages/react && npx tsc -p packages/solid && npx tsc -p packages/examples

      - name: Type check (deno check)
        run: npm run check

      - name: Tests (deno test)
        run: npm test

  smoke:
    # PTY smoke for the @tern-tui/examples demos. The run-smoke.sh harness pipes
    # 'q' into each demo inside a pseudo-TTY via the macOS `script` utility
    # (the demos only exit 0 when their scene rendered AND the event loop quit
    # on 'q'), so this job must run on macOS. The native tern-node addon is
    # built here because the demos load it at runtime.
    name: Smoke (PTY demos, macOS)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    steps:
      - uses: actions/checkout@v7

      # napi build compiles the binding via cargo, so the pinned Rust
      # toolchain is required. rustflags is cleared to match a local build.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          # Cargo caching is handled by Swatinem/rust-cache below; disabling
          # the built-in cache (default on) avoids two overlapping cache
          # entries for the same cargo registry and target dirs.
          cache: false

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          # Hash every package-lock.json in the repo so both the root
          # `npm install` and the tern-node addon `npm install` below share one
          # npm cache keyed on all lockfiles.
          cache-dependency-path: "**/package-lock.json"

      # The demos run under deno (deno-first, constitution §3).
      - uses: denoland/setup-deno@v2
        with:
          # Cache downloaded deno modules & packages (the PTY demos import
          # the tern core modules on every run).
          cache: true

      # npm install (not npm ci): the root workspace includes
      # src/bindings/tern-node, whose tern-node-<platform> optional
      # dependencies are not yet on the registry, so the lockfile cannot pin
      # them and npm ci's sync check would fail (CONTRIBUTING.md, "Building
      # the native addon").
      - name: Install JS dependencies
        run: npm install

      # Build the tern-node napi addon in DEBUG (npm run build:debug).
      # Compile speed matters for this correctness-only smoke and the
      # runtime profile is irrelevant to PTY correctness (demos exit 0
      # iff the scene rendered AND 'q' quits).
      # npm install (not npm ci): the tern-node-<platform> optional
      # dependencies declared for the release strategy are not yet on the
      # registry, so the lockfile cannot pin them; npm install tolerates
      # their absence as optional.
      - name: Build tern-node addon
        working-directory: src/bindings/tern-node
        run: |
          npm install
          npm run build:debug

      - name: PTY smoke (script harness)
        run: bash packages/examples/run-smoke.sh

  napi-build:
    # Multi-platform native addon strategy (napi-rs distribution model):
    # build tern-node for the five most common targets in `napi.targets`
    # (tern-node package.json) — the same rows as release.yml's build job,
    # which carries the full expanded matrix (musl, FreeBSD, riscv64,
    # Android, Windows arm64) at release time. Each row uploads its
    # <platform>-<arch>.node binary; release.yml wires the per-platform
    # binaries via optionalDependencies as tern-node-<platform> packages.
    # Cross-compiled rows skip the native load-check because the binary
    # arch differs from the runner arch. `npm run build` resolves to the
    # RELEASE profile — these binaries are the release artifacts consumed
    # by release.yml.
    name: napi addon — ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build
            load_check: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # Mirrors release.yml: npm run build -- <args> appends args to
            # the LAST command of the script chain (node fix-dts.mjs), so
            # cross rows invoke the napi CLI directly to pass --target.
            # --use-napi-cross is avoided (its toolchain was not installed
            # by npm in CI — npm/cli#4828 class of bug) in favor of the
            # deterministic apt cross gcc; see the release.yml row comment
            # for the full rationale and glibc-floor trade-off.
            build: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu && CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc npx napi build --platform --release --target aarch64-unknown-linux-gnu && node fix-dts.mjs
            load_check: false
          - host: macos-latest
            target: x86_64-apple-darwin
            # Direct napi invocation (arg forwarding as above); the macos
            # runner cross-links x86_64 natively with no cross flag.
            build: npx napi build --platform --release --target x86_64-apple-darwin && node fix-dts.mjs
            load_check: false
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build
            load_check: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build
            load_check: true
    steps:
      - uses: actions/checkout@v7

      # napi build compiles via cargo, so the pinned Rust toolchain is
      # required; rustflags is cleared to match a local build. The target
      # triple is registered via rustup for the cross-compiled rows.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          target: ${{ matrix.settings.target }}
          # Cargo caching is handled by Swatinem/rust-cache below; disabling
          # the built-in cache (default on) avoids two overlapping cache
          # entries for the same cargo registry and target dirs.
          cache: false

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/bindings/tern-node/package-lock.json

      - name: Install addon dependencies
        working-directory: src/bindings/tern-node
        run: npm install

      - name: Build addon (${{ matrix.settings.target }})
        working-directory: src/bindings/tern-node
        run: ${{ matrix.settings.build }}

      # Native load check on rows where the runner arch matches the target.
      - name: Load check (native)
        working-directory: src/bindings/tern-node
        if: ${{ matrix.settings.load_check }}
        run: node load-check.mjs

      - name: Upload addon binary
        uses: actions/upload-artifact@v7
        with:
          name: tern-node-${{ matrix.settings.target }}
          path: src/bindings/tern-node/tern-node.*.node
          if-no-files-found: error

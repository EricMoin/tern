name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the toolchain pinned in rust-toolchain.toml (Rust 1.94.0).
      # rustflags is cleared so the build matches a plain local
      # `cargo build --workspace` invocation (the action's default
      # RUSTFLAGS=-D warnings would be stricter than local).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

  js:
    name: JS workspace (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # The repo's package.json scripts run deno check / deno test.
      - uses: denoland/setup-deno@v2

      - name: Install JS dependencies
        run: npm ci

      - name: Type check (deno check)
        run: npm run check

      - name: Tests (deno test)
        run: npm test

  smoke:
    # PTY smoke for the @tern/examples demos. The run-smoke.sh harness pipes
    # 'q' into each demo inside a pseudo-TTY via the macOS `script` utility
    # (the demos only exit 0 when their scene rendered AND the event loop quit
    # on 'q'), so this job must run on macOS. The native tern-node addon is
    # built here because the demos load it at runtime.
    name: Smoke (PTY demos, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # napi build compiles the binding via cargo, so the pinned Rust
      # toolchain is required. rustflags is cleared to match a local build.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # The demos run under deno (deno-first, constitution §3).
      - uses: denoland/setup-deno@v2

      - name: Install JS dependencies
        run: npm ci

      # Build the tern-node napi addon (full script chain: napi build
      # --platform && node fix-dts.mjs) so the demos can load it.
      # npm install (not npm ci): the tern-node-<platform> optional
      # dependencies declared for the release strategy are not yet on the
      # registry, so the lockfile cannot pin them; npm install tolerates
      # their absence as optional.
      - name: Build tern-node addon
        working-directory: src/bindings/tern-node
        run: |
          npm install
          npm run build

      - name: PTY smoke (script harness)
        run: bash packages/examples/run-smoke.sh

  napi-build:
    # Multi-platform native addon strategy (napi-rs distribution model):
    # build tern-node for every target in `napi.targets` (tern-node
    # package.json). Each row uploads its <platform>-<arch>.node binary;
    # publish.yml wires the per-platform binaries via optionalDependencies
    # as tern-node-<platform> packages. Cross-compiled rows skip the native
    # load-check because the binary arch differs from the runner arch.
    name: napi addon — ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build
            load_check: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: npm run build -- --target aarch64-unknown-linux-gnu --use-napi-cross
            load_check: false
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
            load_check: false
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build
            load_check: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build
            load_check: true
    steps:
      - uses: actions/checkout@v7

      # napi build compiles via cargo, so the pinned Rust toolchain is
      # required; rustflags is cleared to match a local build. The target
      # triple is registered via rustup for the cross-compiled rows.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          targets: ${{ matrix.settings.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/bindings/tern-node/package-lock.json

      - name: Install addon dependencies
        working-directory: src/bindings/tern-node
        run: npm install

      - name: Build addon (${{ matrix.settings.target }})
        working-directory: src/bindings/tern-node
        run: ${{ matrix.settings.build }}

      # Native load check on rows where the runner arch matches the target.
      - name: Load check (native)
        working-directory: src/bindings/tern-node
        if: ${{ matrix.settings.load_check }}
        run: node load-check.mjs

      - name: Upload addon binary
        uses: actions/upload-artifact@v7
        with:
          name: tern-node-${{ matrix.settings.target }}
          path: src/bindings/tern-node/tern-node.*.node
          if-no-files-found: error

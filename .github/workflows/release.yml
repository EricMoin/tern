# Release workflow — tag-triggered (vX.Y.Z) or manual dispatch.
#
# Replaces the superseded publish.yml, which fired on v* tags and published
# the raw src/**/*.ts of the JS packages while the native addon release (the
# tern-node-<platform> optionalDependency wiring) was still a documented next
# step. This workflow follows the napi-rs v3 release template
# (https://napi.rs/docs/deep-dive/release):
#
#   Phase 1 (build) — build the tern-node napi addon for every target in
#     napi.targets (cross rows via the napi-rs cross-build recipes, see the
#     build job), load-check the rows whose runner arch matches the target,
#     and upload each binary as a workflow artifact.
#   Phase 2 (release) — collect the artifacts into the per-platform npm
#     packages (napi create-npm-dirs + napi artifacts), publish the tern-node
#     root package (prepublishOnly runs `napi prepublish -t npm`, publishing
#     the tern-node-<platform> packages first), then build and publish the
#     three JS packages (@tern-tui/core, @tern-tui/react, @tern-tui/solid) in dependency
#     order (core first; react/solid depend on it).
#
# Dormant until a v* tag is pushed (or a manual dispatch) — never runs on
# ordinary pushes, so it cannot double-publish with any other workflow.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      # Used to re-run the JS package publishes (core/react/solid) after a
      # partial failure, when the tern-node addon packages already exist at
      # the target version and a repeat `npm publish` would 409.
      skip_native:
        description: 'Skip publishing tern-node (addon already published at this version)'
        type: boolean
        default: false

jobs:
  build:
    # Build the native addon for every target in napi.targets (tern-node
    # package.json). Each row uploads its <platform>-<arch>.node binary;
    # cross-compiled rows skip the native load-check because the binary
    # arch differs from the runner arch. `npm run build` resolves to the
    # RELEASE profile — these binaries are the release artifacts consumed
    # by the release job below.
    #
    # Cross-build recipes follow the napi-rs cross-build docs
    # (https://napi.rs/docs/cross-build). Runtime verification happens in
    # ci.yml (M4.3): the napi-build matrix mirrors this one and runs a native
    # load-check plus the runtime-smoke.mjs headless renderer gate in a
    # runtime matching the binary, so the release matrix itself stays
    # build-only. Verified set (ci.yml, on GitHub hosted runners):
    #   runtime load-check + smoke:
    #     - linux-gnu x64 — native (ubuntu-latest)
    #     - linux-gnu arm64 — native on ubuntu-24.04-arm (no apt cross gcc)
    #     - linux-musl x64/arm64 — node:alpine container smoke (arm64 row on
    #       ubuntu-24.04-arm, image auto-pulled)
    #     - freebsd x64 — FreeBSD 15 VM via cross-platform-actions/action
    #       (the freebsd-runtime job downloads this job's artifact)
    #     - darwin arm64 — native (macos-latest)
    #     - win32-x64 msvc — native (windows-latest)
    #     - win32-arm64 msvc — native on windows-11-arm
    #   build-only:
    #     - darwin x64 — cross-linked on the arm64 macos runner; no x64 mac
    #       hosted runtime
    #     - riscv64 gnu — no riscv64 hosted runner / official Node runtime
    #     - android arm64 — NDK preinstalled on ubuntu-latest; no Android
    #       runtime on hosted runners (verify on-device, e.g. Termux)
    name: Build tern-node — ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build
            load_check: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # npm run build -- <args> appends args to the LAST command of the
            # script chain (node fix-dts.mjs), so cross rows invoke the napi
            # CLI directly to pass --target. The apt cross gcc is used instead
            # of --use-napi-cross: that flag's toolchain resolves as optional
            # peerDependencies of @napi-rs/cross-toolchain, which npm skipped
            # in CI (npm/cli#4828 class of bug), failing the build. Trade-off:
            # the apt sysroot glibc (2.39 on ubuntu-24.04) becomes the binary's
            # floor, vs glibc 2.17 with --use-napi-cross
            # (https://napi.rs/docs/cross-build) — revisit --use-napi-cross if
            # the toolchain resolution is fixed. ci.yml (M4.3) builds this
            # target natively on the ubuntu-24.04-arm runner instead — no
            # glibc floor there — while this release-time row keeps the
            # deterministic apt cross gcc.
            build: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu && CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc npx napi build --platform --release --target aarch64-unknown-linux-gnu && node fix-dts.mjs
            load_check: false
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            # musl: -x routes through cargo-zigbuild (zig on PATH, set up
            # below); the CLI auto-appends -C target-feature=-crt-static, so
            # the binary is static musl — no glibc floor. Build-only here:
            # the runtime smoke runs in ci.yml (M4.3) inside a node:alpine
            # container, as the napi-rs template tests musl bindings.
            zig: true
            build: npx napi build --platform --release --target x86_64-unknown-linux-musl --cross-compile && node fix-dts.mjs
            load_check: false
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            # arm64 musl: same zig -x recipe; runtime smoke in ci.yml (M4.3)
            # via node:alpine on the ubuntu-24.04-arm runner (arm64 image
            # auto-pulled).
            zig: true
            build: npx napi build --platform --release --target aarch64-unknown-linux-musl --cross-compile && node fix-dts.mjs
            load_check: false
          - host: ubuntu-latest
            target: x86_64-unknown-freebsd
            # FreeBSD: no hosted FreeBSD runner, so -x + zig cross-compiles
            # from Linux (cargo-zigbuild). Build-only here; the runtime smoke
            # runs in ci.yml's freebsd-runtime job (M4.3) inside a FreeBSD 15
            # VM via cross-platform-actions/action — the napi-rs reference
            # setup (action@v1.4.0, operating_system: freebsd, version: '15.0').
            zig: true
            build: npx napi build --platform --release --target x86_64-unknown-freebsd --cross-compile && node fix-dts.mjs
            load_check: false
          - host: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            # riscv64: napi-rs ships no generated CI job for it — the recipe
            # is "no flag + a cross gcc you install" (decision matrix). No
            # riscv64 hosted runner / official Node runtime → build-only.
            build: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu && CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc npx napi build --platform --release --target riscv64gc-unknown-linux-gnu && node fix-dts.mjs
            load_check: false
          - host: ubuntu-latest
            target: aarch64-linux-android
            # Android/Termux: no cross flag — the CLI configures the NDK
            # toolchain from ANDROID_NDK_LATEST_HOME (preinstalled on
            # ubuntu-latest runners) and stops before Cargo if it is missing.
            # Build-only: no Android runtime on hosted runners; verify
            # on-device (e.g. Termux).
            build: npx napi build --platform --release --target aarch64-linux-android && node fix-dts.mjs
            load_check: false
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npx napi build --platform --release --target x86_64-apple-darwin && node fix-dts.mjs
            load_check: false
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build
            load_check: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build
            load_check: true
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            # MSVC cross-links all Windows arches on the x64 windows runner —
            # no cross flag (napi-rs reference setup). Build-only here;
            # ci.yml (M4.3) builds this target natively on the windows-11-arm
            # hosted runner with a load-check + runtime smoke (the napi-rs
            # template tests the arm64 binding there; rustup is bootstrapped
            # manually on that image).
            build: npx napi build --platform --release --target aarch64-pc-windows-msvc && node fix-dts.mjs
            load_check: false
    steps:
      - uses: actions/checkout@v7

      # napi build compiles via cargo, so the pinned Rust toolchain is
      # required; rustflags is cleared to match a local build. The target
      # triple is registered via rustup for the cross-compiled rows.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          target: ${{ matrix.settings.target }}
          # Cargo caching is handled by Swatinem/rust-cache below; disabling
          # the built-in cache (default on) avoids two overlapping cache
          # entries for the same cargo registry and target dirs.
          cache: false

      - uses: Swatinem/rust-cache@v2

      # zig is the cross linker for the musl and FreeBSD rows (-x routes
      # through cargo-zigbuild, which the CLI auto-installs; the explicit
      # install below pins the version like the napi-rs generated CI).
      - uses: mlugg/setup-zig@v2
        if: ${{ matrix.settings.zig }}
        with:
          version: 0.14.1

      - uses: taiki-e/install-action@v2
        if: ${{ matrix.settings.zig }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/bindings/tern-node/package-lock.json

      - name: Install addon dependencies
        working-directory: src/bindings/tern-node
        run: npm install

      - name: Build addon (${{ matrix.settings.target }})
        working-directory: src/bindings/tern-node
        run: ${{ matrix.settings.build }}

      # Native load check on rows where the runner arch matches the target.
      - name: Load check (native)
        working-directory: src/bindings/tern-node
        if: ${{ matrix.settings.load_check }}
        run: node load-check.mjs

      - name: Upload addon binary
        uses: actions/upload-artifact@v7
        with:
          name: tern-node-${{ matrix.settings.target }}
          path: src/bindings/tern-node/tern-node.*.node
          if-no-files-found: error

  release:
    # Collect the per-platform binaries, publish the native addon
    # (platform packages via `napi prepublish -t npm`, then the root
    # tern-node package), then build and publish the JS packages in
    # dependency order. contents: write for GitHub release assets,
    # id-token: write for npm provenance (napi-rs release convention).
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      # Trusted Publishing (OIDC) requires npm >= 11.5.1, so the CLI is
      # pinned to npm@11 instead of @latest: npm 12 changed `npm pack
      # --dry-run --json` to emit an object keyed by package name instead
      # of an array, which breaks the @napi-rs/cli 3.8.2 `napi prepublish`
      # validation (it reads packResult[0].files and throws "Failed to
      # validate the release package"). This job also runs on Node 24
      # because npm 12.x dropped Node 20 support (requires ^22.22.2 ||
      # ^24.15.0 || >=26); all JS packages declare engines.node >=20, so
      # Node 24 is compatible. With a trusted publisher configured on each
      # package, npm publish exchanges the Actions OIDC token for publish
      # credentials — no NPM_TOKEN secret involved.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      # tern-node is not a root workspace member, and its prepublishOnly
      # (`napi prepublish -t npm`) resolves the pinned @napi-rs/cli from
      # its own node_modules/.bin, so the addon package needs its own
      # `npm install` before the napi steps. The tern-node-<platform>
      # optional dependencies are not on the registry yet; npm install
      # tolerates their absence as optional.
      - name: Install addon dependencies
        working-directory: src/bindings/tern-node
        run: npm install

      # Download every build-job artifact. download-artifact nests one
      # directory per artifact under this path; `napi artifacts` searches
      # the ./artifacts dir recursively, so the layout is picked up as-is.
      - name: Download addon artifacts
        uses: actions/download-artifact@v8
        with:
          path: src/bindings/tern-node/artifacts

      # npm run <script> runs the plain napi CLI commands via the package
      # scripts (create-npm-dirs / artifacts), resolving the pinned
      # @napi-rs/cli from the package's own node_modules/.bin.
      - name: Create npm platform dirs (napi create-npm-dirs)
        working-directory: src/bindings/tern-node
        run: npm run create-npm-dirs

      - name: Collect artifacts (napi artifacts)
        working-directory: src/bindings/tern-node
        run: npm run artifacts

      # Publishes the tern-node-<platform> packages via the prepublishOnly
      # hook (`napi prepublish -t npm`), then the tern-node root package.
      # Skipped on manual dispatch with skip_native=true, when the addon
      # packages already exist at this version (re-publish would E409).
      - name: Publish tern-node
        working-directory: src/bindings/tern-node
        if: ${{ !inputs.skip_native }}
        run: npm publish --access public

      # Root install must come after tern-node is published: @tern-tui/core
      # depends on tern-node@0.2.0, which resolves from the registry only
      # once the addon root package exists.
      - name: Install JS workspace dependencies
        run: npm install

      # The workspace build scripts run `deno task build` (per-package
      # deno.json), so deno must be on PATH for the release build step.
      - uses: denoland/setup-deno@v2
        with:
          cache: true

      # Build in dependency order — core first, then react and solid.
      - name: Build JS packages (@tern-tui/core, @tern-tui/react, @tern-tui/solid)
        run: npm run build -w @tern-tui/core && npm run build -w @tern-tui/react && npm run build -w @tern-tui/solid

      # Publish in dependency order — core first, then react and solid.
      - name: Publish @tern-tui/core
        run: npm publish --access public -w @tern-tui/core

      - name: Publish @tern-tui/react
        run: npm publish --access public -w @tern-tui/react

      - name: Publish @tern-tui/solid
        run: npm publish --access public -w @tern-tui/solid

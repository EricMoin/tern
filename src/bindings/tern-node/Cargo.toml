[package]
name = "tern-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tern napi binding: Deno/Node.js -> tern-core bridge"

[lib]
crate-type = ["cdylib"]

[features]
# Push-based event delivery (roadmap Phase 3): the renderer's event loop
# pushes normalized events into a napi `ThreadsafeFunction`, and the JS
# renderer subscribes instead of polling. This is the default event path.
default = ["push-events"]
# Push delivery via `TuiRenderer::start_event_stream` (napi ThreadsafeFunction
# + a background tern-terminal event loop).
push-events = []
# Pull-based `poll_events` fallback for hosts without a napi JS thread to
# push into (e.g. wasm builds of the bindings).
poll-fallback = []

[dependencies]
# `dyn-symbols` (a napi-rs default, restored here) resolves N-API symbols
# through a runtime function table with link-time stubs, so the crate's unit
# tests — which exercise the napi Error path — link and run without a Node
# runtime, while the addon still loads the real symbols from the host.
napi = { version = "3", default-features = false, features = ["napi8", "serde-json", "dyn-symbols"] }
napi-derive = "3"
serde_json = "1"
tern-core = { path = "../../core/tern-core" }
tern-components = { path = "../../core/tern-components" }
tern-highlight = { path = "../../core/tern-highlight" }
tern-terminal = { path = "../../core/tern-terminal" }

[build-dependencies]
napi-build = "2"

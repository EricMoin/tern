[package]
name = "tern-node"
version.workspace = true
edition.workspace = true
description = "tern napi binding: Deno/Node.js -> tern-core bridge"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
serde_json = "1"
tern-core = { path = "../../core/tern-core" }
tern-components = { path = "../../core/tern-components" }
tern-terminal = { path = "../../core/tern-terminal" }

[build-dependencies]
napi-build = "2"

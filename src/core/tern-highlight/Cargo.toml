[package]
name = "tern-highlight"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tern highlight: tree-sitter token highlighting mapped to styled spans"

[dependencies]
tern-core = { path = "../tern-core" }
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.23"
tree-sitter-bash = "0.25"
# M3.7 grammar expansion — versions pinned to the exact release whose ABI
# version (generator CLI) falls in the tree-sitter 0.26 runtime's compatible
# range 13..=15 (TREE_SITTER_MIN_COMPATIBLE_LANGUAGE_VERSION..LANGUAGE_VERSION):
# python 0.25.0 / go 0.25.0 / c 0.24.2 = ABI 15; toml-ng 0.7.0 / yaml 0.7.2 /
# cpp 0.23.4 = ABI 14. All use the new-style `tree-sitter-language 0.1`
# `LANGUAGE: LanguageFn` binding. tree-sitter-markdown is intentionally NOT
# included: the only published release (0.7.1) is an old-style binding
# (depends on tree-sitter 0.19) and ships no highlight query.
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
unicode-width = "0.2"
